<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7f7b73"/></marker>
    <style>
      .bg{fill:#fbfaf7}.title{font:700 26px "Microsoft YaHei",Arial,sans-serif;fill:#333}.node{rx:10;stroke-width:1.5}.blue{fill:#e8f3ff;stroke:#6aa3df}.green{fill:#dff4ee;stroke:#4ba993}.purple{fill:#eeeaff;stroke:#8b80e8}.orange{fill:#fff1dc;stroke:#d9963a}.label{font:700 16px "Microsoft YaHei",Arial,sans-serif;fill:#333}.small{font:500 13px "Microsoft YaHei",Arial,sans-serif;fill:#4f4b45}.mono{font:500 12px Consolas,monospace;fill:#555}.line{stroke:#7f7b73;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text x="60" y="58" class="title">商店浏览与安装流程</text>

  <rect x="65" y="135" width="220" height="110" class="node blue"/>
  <text x="175" y="174" text-anchor="middle" class="label">McpMarketplaceView</text>
  <text x="175" y="202" text-anchor="middle" class="small">type=mcp / skills / cli</text>
  <text x="175" y="224" text-anchor="middle" class="mono">routeKind()</text>

  <rect x="365" y="135" width="220" height="110" class="node purple"/>
  <text x="475" y="174" text-anchor="middle" class="label">capabilityStore</text>
  <text x="475" y="202" text-anchor="middle" class="small">fetchMarketplace(kind)</text>
  <text x="475" y="224" text-anchor="middle" class="mono">normalizeCapability()</text>

  <rect x="665" y="135" width="260" height="110" class="node orange"/>
  <text x="795" y="174" text-anchor="middle" class="label">CapabilityController</text>
  <text x="795" y="202" text-anchor="middle" class="small">GET /marketplace</text>
  <text x="795" y="224" text-anchor="middle" class="mono">kind/category/q/page</text>

  <rect x="990" y="135" width="155" height="110" class="node green"/>
  <text x="1067" y="174" text-anchor="middle" class="label">skill 表</text>
  <text x="1067" y="202" text-anchor="middle" class="small">目录来源</text>
  <text x="1067" y="224" text-anchor="middle" class="mono">source + key</text>

  <rect x="220" y="385" width="230" height="115" class="node blue"/>
  <text x="335" y="424" text-anchor="middle" class="label">点击安装</text>
  <text x="335" y="452" text-anchor="middle" class="small">toggleInstall(connector)</text>
  <text x="335" y="474" text-anchor="middle" class="mono">POST /{skillKey}/install</text>

  <rect x="545" y="385" width="230" height="115" class="node green"/>
  <text x="660" y="424" text-anchor="middle" class="label">写安装关系</text>
  <text x="660" y="452" text-anchor="middle" class="small">user_skill_install</text>
  <text x="660" y="474" text-anchor="middle" class="mono">user_id + skill_id</text>

  <rect x="870" y="385" width="230" height="115" class="node purple"/>
  <text x="985" y="424" text-anchor="middle" class="label">刷新输入区</text>
  <text x="985" y="452" text-anchor="middle" class="small">skills-updated 事件</text>
  <text x="985" y="474" text-anchor="middle" class="mono">enabledSkillMeta</text>

  <path class="line" d="M285 190H365"/>
  <path class="line" d="M585 190H665"/>
  <path class="line" d="M925 190H990"/>
  <path class="line" d="M1067 245v72H175v68"/>
  <path class="line" d="M450 443h95"/>
  <path class="line" d="M775 443h95"/>
</svg>
