<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7f7b73"/></marker>
    <style>
      .bg{fill:#fbfaf7}.title{font:700 26px "Microsoft YaHei",Arial,sans-serif;fill:#333}.node{rx:10;stroke-width:1.5}.blue{fill:#e8f3ff;stroke:#6aa3df}.green{fill:#dff4ee;stroke:#4ba993}.purple{fill:#eeeaff;stroke:#8b80e8}.orange{fill:#fff1dc;stroke:#d9963a}.neutral{fill:#f7f5ef;stroke:#aaa69d}.label{font:700 16px "Microsoft YaHei",Arial,sans-serif;fill:#333}.small{font:500 13px "Microsoft YaHei",Arial,sans-serif;fill:#4f4b45}.mono{font:500 12px Consolas,monospace;fill:#555}.line{stroke:#7f7b73;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="60" y="58" class="title">目录同步爬虫建议结构</text>
  <text x="60" y="86" class="small">当前代码只有调度入口，没有真实全网抓取；下图是后续可直接落地的安全同步链路。</text>

  <rect x="70" y="135" width="220" height="110" class="node green"/>
  <text x="180" y="171" text-anchor="middle" class="label">MCP 来源</text>
  <text x="180" y="199" text-anchor="middle" class="small">官方 Registry / Smithery</text>
  <text x="180" y="222" text-anchor="middle" class="mono">PulseMCP / mcp.so / Glama</text>

  <rect x="70" y="305" width="220" height="110" class="node purple"/>
  <text x="180" y="341" text-anchor="middle" class="label">Skills 来源</text>
  <text x="180" y="369" text-anchor="middle" class="small">Claude Skills 仓库</text>
  <text x="180" y="392" text-anchor="middle" class="mono">GitHub repo + SKILL.md</text>

  <rect x="70" y="475" width="220" height="110" class="node orange"/>
  <text x="180" y="511" text-anchor="middle" class="label">CLI 来源</text>
  <text x="180" y="539" text-anchor="middle" class="small">精选白名单优先</text>
  <text x="180" y="562" text-anchor="middle" class="mono">npm / Homebrew / GitHub</text>

  <rect x="410" y="245" width="260" height="150" class="node blue"/>
  <text x="540" y="286" text-anchor="middle" class="label">CapabilityCatalogSyncJob</text>
  <text x="540" y="315" text-anchor="middle" class="small">定时拉取、分页、限流</text>
  <text x="540" y="340" text-anchor="middle" class="small">归一化字段和 kind</text>
  <text x="540" y="365" text-anchor="middle" class="mono">@Scheduled</text>

  <rect x="775" y="175" width="270" height="120" class="node orange"/>
  <text x="910" y="214" text-anchor="middle" class="label">安全审查</text>
  <text x="910" y="242" text-anchor="middle" class="small">SSRF / endpoint / installSpec</text>
  <text x="910" y="266" text-anchor="middle" class="mono">pending / approved / quarantined</text>

  <rect x="775" y="365" width="270" height="120" class="node green"/>
  <text x="910" y="404" text-anchor="middle" class="label">写入统一表</text>
  <text x="910" y="432" text-anchor="middle" class="small">skill / skill_tool</text>
  <text x="910" y="456" text-anchor="middle" class="mono">source + skill_key + metadata</text>

  <rect x="775" y="555" width="270" height="90" class="node neutral"/>
  <text x="910" y="591" text-anchor="middle" class="label">前端读取</text>
  <text x="910" y="619" text-anchor="middle" class="mono">GET /skills/capabilities/marketplace</text>

  <path class="line" d="M290 190h120"/>
  <path class="line" d="M290 360h120"/>
  <path class="line" d="M290 530h120v-210"/>
  <path class="line" d="M670 320h75v-85h30"/>
  <path class="line" d="M910 295v70"/>
  <path class="line" d="M910 485v70"/>
</svg>
