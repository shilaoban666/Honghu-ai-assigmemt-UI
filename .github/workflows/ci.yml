name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

# 同一分支有新提交时，取消尚在运行的旧 run。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 核心质量门：lint + 单元/组件测试 + 生产构建。必须全绿。
  build:
    name: Lint · Test · Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # 端到端冒烟测试：独立 job，浏览器走缓存。
  # E2E 用真实浏览器 + 自动起 dev server，存在天然 flake；这里 continue-on-error=true，
  # 让偶发的 E2E 失败不拖红整体绿标（核心质量门是上面的 build job）。
  # 若希望 E2E 也强制阻塞合并，删掉 continue-on-error 即可。
  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 缓存 Playwright 浏览器二进制（~/.cache/ms-playwright），避免每次重下 chromium。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # 缓存未命中：装浏览器 + 系统依赖；命中：浏览器已在缓存里，只补系统依赖。
      - name: Install Playwright (browser + OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
