name: Release

# 打 tag（如 v1.2.0）即出版本：构建生产包并把 dist.zip 附到 GitHub Release。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build · Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (inject prod API URL)
        run: npm run build
        env:
          # 在仓库 Settings → Variables 里配置生产后端地址；未配置则回退到 .env 默认。
          VITE_AUTH_API_URL: ${{ vars.VITE_AUTH_API_URL }}

      - name: Zip dist
        run: (cd dist && zip -r "../honghu-ui-${{ github.ref_name }}.zip" .)

      - name: Create GitHub Release (attach dist.zip)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: honghu-ui-*.zip
